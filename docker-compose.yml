
services:
  discord:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8081"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=2)\"" ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.53.5
    profiles:
      - monitoring
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      discord:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:9.4.0
    profiles:
      - monitoring
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
     - "3000:3000"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USERNAME}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    restart: unless-stopped

volumes:
  prometheus-data:
